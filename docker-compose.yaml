services:
  proxy:
    build: .
    container_name: teldrive-go-proxy
    env_file:
      - .env
    # Increase file descriptor limits for high-performance streaming
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    network_mode: host
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s