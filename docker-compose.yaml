services:
  proxy:
    build: .
    container_name: teldrive-python-proxy
    env_file:
      - .env
    # --- THE FIX IS HERE ---
    # Increase the file descriptor limit for the container.
    # This allows each worker to handle many more simultaneous connections.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    network_mode: host